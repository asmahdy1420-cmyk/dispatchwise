[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatchwise"
version = "0.1.0"
description = "Multi-location pharmacy order dispatch optimiser: order splitting, weighted driver assignment and demand-zone clustering."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmed Mahdy", email = "mahdy@progma.tech" }]
requires-python = ">=3.11"
keywords = ["dispatch", "logistics", "pharmacy", "health-tech", "fastapi", "optimisation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
clustering = ["scikit-learn>=1.3", "numpy>=1.24"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
dispatchwise = "dispatchwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "RUF"]
